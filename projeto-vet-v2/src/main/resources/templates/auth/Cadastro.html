<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Cadastro - Pet Care')}">

<body>

<main class="container">

    <div class="card">
        <h1>Pet Care</h1>
        <p class="subtitulo"> Cadastro de responsável </p>
        <form th:object="${cadastro}"
              th:action="@{/cadastro}"
              method="post">
              
            <div class="mensagem erro" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="erro : ${#fields.globalErrors()}"
                   th:text="${erro}">
                </p>

            </div>


            <label for="nome"> Nome </label>
            <input
                type="text"
                id="nome"
                th:field="*{nome}"
                th:errorclass="is-invalid">

            <div class="campo-erro"
                 th:errors="*{nome}">
            </div>


            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                th:field="*{email}"
                th:errorclass="is-invalid">

            <div class="campo-erro"
                 th:errors="*{email}">
            </div>


            <label for="telefone"> Telefone</label>
            <input
                type="text"
                id="telefone"
                th:field="*{telefone}"
                th:errorclass="is-invalid">
            <div class="campo-erro"
                 th:errors="*{telefone}">
            </div>
           
           <label for="cpf"> CPF </label>
            <input
                type="text"
                id="cpf"
                th:field="*{cpf}"
                th:errorclass="is-invalid">

            <div class="campo-erro"
                 th:errors="*{cpf}">
            </div>


            <label for="dataNascimento">Data de nascimento </label>
            <input
                type="date"
                id="dataNascimento"
                th:field="*{dataNascimento}"
                th:errorclass="is-invalid">

            <div class="campo-erro"
                 th:errors="*{dataNascimento}">
            </div>


            <label for="senha"> Senha </label>
            <input
                type="password"
                id="senha"
                th:field="*{senha}"
                th:errorclass="is-invalid">

            <div class="campo-erro"
                 th:errors="*{senha}">
            </div>


            <label for="confirmarSenha"> Confirmar senha </label>
            <input
                type="password"
                id="confirmarSenha"
                th:field="*{confirmarSenha}"
                th:errorclass="is-invalid">

            <div class="campo-erro"
                 th:errors="*{confirmarSenha}">
            </div>
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">
            <button type="submit"> Cadastrar </button>
        </form>


        <p class="link"> Já possui conta?
            <a th:href="@{/login}"> Fazer login </a>
        </p>

    </div>

</main>

</body>

</html>
