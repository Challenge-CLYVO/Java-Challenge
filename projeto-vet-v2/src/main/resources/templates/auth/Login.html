<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
      

<head 
      th:replace= "~{fragmentos :: cabecalho('Login - Pet Care')}">
</head>

<body>

<main class="container">

    <div class="card">
        <h1>Pet Care</h1>
        <p class="subtitulo">
            Entre na sua conta
        </p>

        <div class="mensagem erro" th:if="${param.error}">
            Email ou senha inválidos.
        </div>


        <div class="mensagem sucesso" th:if="${param.logout}">
            Logout realizado com sucesso.
        </div>


        <div class="mensagem sucesso" th:if="${param.cadastroSucesso}">
            Cadastro realizado com sucesso.
        </div>


        <form th:action="@{/login}" method="post">
            <label for="email"> Email </label>
            <input
                type="email"
                id="email"
                name="email"
                required>
            <label for="password"> Senha </label>
            <input
                type="password"
                id="password"
                name="password"
                required>
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">
            <button type="submit"> Entrar </button>  
        </form>


        <p class="link"> Não possui conta?
            <a th:href="@{/cadastro}"> Cadastre-se </a>   
        </p>

    </div>

</main>

</body>

</html>
